name: Release - Deploy Play Store

# Trigger via manual dispatch or reusable workflow call
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'The track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal
  workflow_call:
    inputs:
      track:
        description: 'The track to deploy to'
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate deployment track
        env:
          INPUT_TRACK: ${{ inputs.track }}
        run: |
          case "$INPUT_TRACK" in
            internal|alpha|beta|production) ;;
            *)
              echo "::error::Invalid Play Store track: $INPUT_TRACK"
              exit 1
              ;;
          esac
      
      # Download build artifacts generated by previous jobs
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: app/build/outputs/

      
      # Decode the Service Account JSON for Google Play API access
      - name: Decode Service Account Key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" | tr -d '[:space:]' | base64 -d > service_account.json
          chmod 600 service_account.json


      # Upload the AAB to the Play Console
      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.hsb.calchub
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Clean up credentials
        if: always()
        run: rm -f service_account.json

