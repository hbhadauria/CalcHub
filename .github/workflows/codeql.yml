# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Analysis"

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 14 * * 2' # Run weekly on Tuesday at 14:24
  workflow_dispatch: # Allow manual trigger
  workflow_call: # Allow call from other workflows

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write # Required to upload CodeQL results
      packages: read # Required if using private packages
      actions: read # Required for internal actions
      contents: read # Required to checkout the repo

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual # Manual build is required for Android/Kotlin projects with specific Gradle setups

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Initialize CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        tools: linked

    # CodeQL's Kotlin extractor currently requires Kotlin < 2.2.30.
    # Keep compiler and bytecode targets aligned for this analysis-only build.
    - name: Use CodeQL-supported Kotlin version and bytecode target
      run: |
        sed -i \
          -e 's/kotlin = "2.4.21"/kotlin = "2.2.10"/' \
          -e 's/JavaVersion.VERSION_25/JavaVersion.VERSION_21/g' \
          -e 's/JvmTarget.JVM_25/JvmTarget.JVM_21/g' \
          gradle/libs.versions.toml app/build.gradle.kts
        grep -Fq 'kotlin = "2.2.10"' gradle/libs.versions.toml
        ! grep -Fq 'VERSION_25' app/build.gradle.kts
        ! grep -Fq 'JVM_25' app/build.gradle.kts

    # Set up the project's Temurin 25 toolchain
    - name: Set up Temurin JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Manual Build step for Android/Kotlin
    # We use ./gradlew assembleDebug to ensure the project builds correctly before analysis.
    # This prevents the 'autobuild' failure common with complex Android projects.
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Run the actual analysis and upload results to GitHub Security tab
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
