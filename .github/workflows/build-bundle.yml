name: Release - Build App Bundle

# Triggered via workflow_call (reusable) or manual dispatch
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Decode the Base64 encoded keystore and save it to a file
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/release-keystore.jks
          chmod 600 app/release-keystore.jks
      
      # Build the release Bundle using environment-configured signing credentials
      - name: Build Release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          retention-days: 1
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Clean up signing material
        if: always()
        run: rm -f app/release-keystore.jks
