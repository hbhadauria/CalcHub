name: Create GitHub Release

# Manually triggered workflow to tag main and publish a GitHub Release
on:
  workflow_dispatch:

permissions: {}

jobs:
  create-github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify Main Branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Create GitHub Release can only run on the 'main' branch (current ref: $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read Version
        id: version
        run: |
          FILE="version.properties"
          VERSION_CODE=""
          VERSION_NAME=""
          if [ -f "$FILE" ]; then
            while IFS='=' read -r key value || [ -n "$key" ]; do
              [ -n "$key" ] || continue
              value=${value%$'\r'}
              case "$key" in
                VERSION_CODE) VERSION_CODE="$value" ;;
                VERSION_NAME) VERSION_NAME="$value" ;;
              esac
            done < "$FILE"
          else
            echo "::error::version.properties not found!"
            exit 1
          fi

          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "::error::VERSION_CODE or VERSION_NAME missing in version.properties"
            exit 1
          fi

          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION_NAME" =~ $SEMVER_RE ]]; then
            echo "::error::Invalid version_name format: $VERSION_NAME"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "::error::Tag v$VERSION_NAME already exists."
            exit 1
          fi

          {
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Preparing release for $VERSION_NAME (Build $VERSION_CODE)"

      - name: Extract & Validate Release Notes from CHANGELOG
        id: extract_notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          RELEASE_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          NOTES=$(awk -v target="## [$RELEASE_VERSION]" '
            index($0, target) == 1 { flag=1; next }
            /^## \[/ { flag=0 }
            /^---$/ { flag=0 }
            flag { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(awk '
              /^## \[Unreleased\]/ { flag=1; next }
              /^## \[/ { flag=0 }
              /^---$/ { flag=0 }
              flag { print }
            ' CHANGELOG.md)
          fi

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::No release notes found in CHANGELOG.md under ## [$RELEASE_VERSION] or ## [Unreleased]"
            exit 1
          fi

          printf '%s\n' "$NOTES" > release_notes.md

          echo "Release notes extracted for version $RELEASE_VERSION (Build $RELEASE_CODE)"
          cat release_notes.md

      - name: Create Git Tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          RELEASE_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION (Build $RELEASE_CODE)"
          git push origin "v$RELEASE_VERSION"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: CalcHub v${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="v$RELEASE_VERSION"
          BODY=$(gh release view "$TAG" --json body --jq .body)
          echo "Release body length: ${#BODY}"

          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ] || printf '%s\n' "$BODY" | grep -q "^Release version "; then
            echo "::error::Release notes fell back to empty or 1-line placeholder for $TAG"
            exit 1
          fi
