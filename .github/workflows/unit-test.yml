name: PR Checks (Tests, Coverage & Lint)

# Trigger on pull requests to main, manual dispatch, or reusable workflow call
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Run unit + Robolectric Compose/Espresso tests, JaCoCo report, lint, debug APK, and compile androidTest
      - name: Run unit tests, lint, and compile instrumentation tests
        run: ./gradlew jacocoTestReport lintDebug assembleDebug assembleDebugAndroidTest --stacktrace


      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test*/*.xml'


      - name: Publish Coverage Summary
        uses: PavanMudigonda/jacoco-reporter@v5.2.1
        if: always()
        with:
          coverage_results_path: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          coverage_report_name: Coverage Summary
          coverage_report_title: JaCoCo Coverage Summary
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 0
          fail_below_threshold: false
          publish_only_summary: true

