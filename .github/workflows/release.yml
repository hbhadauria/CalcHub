name: Create New Release

# Manually triggered workflow to orchestrate a full release
# Handles versioning, testing, security scanning, building, and deploying
on:
  workflow_dispatch:
    inputs:
      run_security_scan:
        description: 'Run CodeQL security scan? (Recommended for release)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      run_unit_tests:
        description: 'Run unit tests? (Prevents bad builds)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      run_instrumentation_tests:
        description: 'Run Espresso instrumentation tests on Android Emulator?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      track:
        description: 'The track to deploy to (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal
      bump_version_code:
        description: 'Auto-increment Build Number? (Select "no" to keep current)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      version_name:
        description: 'New Version Name (e.g. 1.2.0). Leave empty to keep current.'
        required: false
        type: string

permissions: {}

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version_code: ${{ steps.bump.outputs.version_code }}
      new_version_name: ${{ steps.bump.outputs.version_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Auto-increments version code and optionally updates version name in version.properties
      - name: Bump Version
        id: bump
        env:
          INPUT_BUMP_VERSION_CODE: ${{ github.event.inputs.bump_version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          # Read properties
          FILE="version.properties"
          if [ -f "$FILE" ]; then
            while IFS='=' read -r key value; do
              [ -n "$key" ] || continue
              export "$key=$value"
            done < "$FILE"
          else
            echo "version.properties not found!"
            exit 1
          fi


          # Increment Code
          if [ "$INPUT_BUMP_VERSION_CODE" = "yes" ]; then
            NEW_CODE=$((VERSION_CODE + 1))
          else
            NEW_CODE=$VERSION_CODE
          fi
          
          # Determine Name
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
          if [ -n "$INPUT_VERSION_NAME" ]; then
            if [[ ! "$INPUT_VERSION_NAME" =~ $SEMVER_RE ]]; then
              echo "::error::Invalid version_name format: $INPUT_VERSION_NAME"
              exit 1
            fi
            NEW_NAME="$INPUT_VERSION_NAME"
          else
            NEW_NAME="$VERSION_NAME"
          fi

          # Write back
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$NEW_CODE" "$NEW_NAME" > "$FILE"

          # Promote [Unreleased] in CHANGELOG.md when version_name increases and unreleased notes exist
          if [ -n "$INPUT_VERSION_NAME" ] && [ "$NEW_NAME" != "$VERSION_NAME" ] && [ "$(printf '%s\n%s\n' "$VERSION_NAME" "$NEW_NAME" | sort -V | tail -n 1)" = "$NEW_NAME" ] && [ -f "CHANGELOG.md" ] && ! grep -qF "## [$NEW_NAME]" CHANGELOG.md; then
            UNRELEASED_NOTES=$(awk '
              /^## \[Unreleased\][[:space:]]*$/ { flag=1; next }
              /^## \[/ { flag=0 }
              /^---$/ { flag=0 }
              flag { print }
            ' CHANGELOG.md)
            if [ -n "$(printf '%s' "$UNRELEASED_NOTES" | tr -d '[:space:]')" ]; then
              RELEASE_DATE=$(date -u +%Y-%m-%d)
              awk -v header="## [$NEW_NAME] - $RELEASE_DATE" '
                !replaced && /^## \[Unreleased\][[:space:]]*$/ { print header; replaced=1; next }
                { print }
              ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
              echo "Updated CHANGELOG.md: promoted [Unreleased] to [$NEW_NAME] - $RELEASE_DATE"
            fi
          fi
          
          {
            echo "version_code=$NEW_CODE"
            echo "version_name=$NEW_NAME"
          } >> "$GITHUB_OUTPUT"
          
          # Display
          echo "Bumping version: $VERSION_NAME ($VERSION_CODE) -> $NEW_NAME ($NEW_CODE)"

      # Commit the updated version.properties (and CHANGELOG.md when applicable) back to the repo
      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: bump version to ${{ steps.bump.outputs.version_name }} (${{ steps.bump.outputs.version_code }}) [skip ci]"
          file_pattern: version.properties CHANGELOG.md


  security-scan:
    needs: version-bump
    if: ${{ github.event.inputs.run_security_scan == 'yes' }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml # Call reusable workflow


  test:
    if: ${{ github.event.inputs.run_unit_tests == 'yes' }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/unit-test.yml

  instrumentation-test:
    if: ${{ github.event.inputs.run_instrumentation_tests == 'yes' }}
    permissions:
      contents: read
    uses: ./.github/workflows/instrumentation-test.yml

  build:
    needs: [test, instrumentation-test, version-bump]
    # Run build if version-bump succeeded AND (tests succeeded OR tests were skipped) AND (instrumentation succeeded OR skipped)
    if: ${{ always() && needs.version-bump.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.instrumentation-test.result == 'success' || needs.instrumentation-test.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-bundle.yml # Call reusable workflow
    secrets: inherit


  deploy:
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-playstore.yml
    with:
      track: ${{ github.event.inputs.track }}
    secrets: inherit
